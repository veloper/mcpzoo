services:
  mcpzoo:
    build:
      context: .
      dockerfile: Dockerfile.development
    container_name: "mcpzoo-dev"
    restart: always
    ports:
      - "7998-8199:7998-8199"
    environment:
      - APP_ENV=development
      - APP_USERNAME=${APP_USERNAME:-admin}
      - APP_PASSWORD=${APP_PASSWORD:-changeme123}
    volumes:
      - ./docker/etc/overmind:/etc/overmind
      - ./docker/etc/supervisor:/etc/supervisor
      - ./backend:/app/backend
      - ./data:/app/data
    networks:
      - mcpzoo-net
networks:
  mcpzoo-net:
    driver: bridge
